<!doctype html>
<!--
  Test-guide shell (factory:test-guide). Copy it to the scratchpad, fill it,
  then run inline-assets.mjs so the file the client gets is self-contained.

  Fill:
  - lang, <title> and the {{...}} slots.
  - FONTS and THEME in the <style>: from release.notes.guide.
  - GUIDE in the <script>: the storage key, the UI labels in the project's
    language, and the scenarios (title, tag, situation, steps, expected).
  Keep the markup and the script below GUIDE as they are: the index, ticks
  kept in the tester's browser, keyboard arrows, and a print of every scenario.
-->
<html lang="{{lang}}">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{Project}} v{{version}} - {{Test guide}}</title>

<style>
  /* FONTS: one @font-face per woff2 file release.notes.guide names, a path
     relative to this file. inline-assets.mjs embeds them. No fonts in the
     guide: delete the block, the stacks fall back to system fonts. */
  @font-face { font-family: "Display"; src: url("{{fonts/display.woff2}}") format("woff2"); font-weight: 600 800; }
  @font-face { font-family: "Body"; src: url("{{fonts/body.woff2}}") format("woff2"); font-weight: 400 600; }
  @font-face { font-family: "Mono"; src: url("{{fonts/mono.woff2}}") format("woff2"); font-weight: 400 600; }

  /* THEME: light and dark values from release.notes.guide (the two dark blocks below too). */
  :root {
    --bg: #f1eee9;
    --surface: #ffffff;
    --surface-2: #f7f5f1;
    --border: #e0dad1;
    --border-strong: #bdb5a9;
    --ink: #17181a;
    --muted: #5d5a55;
    --accent: #c9531f;
    --accent-soft: #fbeae1;
    --ok: #2a7d52;
    --ok-soft: #e8f3ec;
    --code-bg: #f3efe8;
    --shadow: 0 1px 2px rgba(23, 24, 26, .06), 0 8px 24px -12px rgba(23, 24, 26, .18);

    --display: "Display", "Segoe UI", system-ui, sans-serif;
    --body: "Body", "Segoe UI", system-ui, sans-serif;
    --mono: "Mono", ui-monospace, "Consolas", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121314;
      --surface: #1a1b1d;
      --surface-2: #212225;
      --border: #2c2d30;
      --border-strong: #3d3f43;
      --ink: #ececec;
      --muted: #a09c96;
      --accent: #f07a45;
      --accent-soft: #3a2116;
      --ok: #4fb477;
      --ok-soft: #16281e;
      --code-bg: #26272a;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px -16px rgba(0, 0, 0, .7);
    }
  }

  :root[data-theme="dark"] {
    --bg: #121314;
    --surface: #1a1b1d;
    --surface-2: #212225;
    --border: #2c2d30;
    --border-strong: #3d3f43;
    --ink: #ececec;
    --muted: #a09c96;
    --accent: #f07a45;
    --accent-soft: #3a2116;
    --ok: #4fb477;
    --ok-soft: #16281e;
    --code-bg: #26272a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px -16px rgba(0, 0, 0, .7);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .layout {
    display: grid;
    grid-template-columns: 17.5rem minmax(0, 1fr);
    gap: clamp(16px, 2.5vw, 32px);
    max-width: 72rem;
    margin: 0 auto;
    padding: clamp(16px, 3.5vw, 40px) clamp(16px, 3vw, 28px);
    align-items: start;
  }

  /* ---- index ---- */

  .indice {
    position: sticky;
    top: clamp(16px, 3.5vw, 40px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .indice header {
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }

  .indice h2 {
    margin: 0;
    font-family: var(--mono);
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .indice p {
    margin: 4px 0 0;
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .04em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .indice nav {
    display: flex;
    flex-direction: column;
    padding: 6px;
    max-height: min(60vh, 34rem);
    overflow-y: auto;
  }

  .item {
    display: grid;
    grid-template-columns: 1.9rem 1fr .8rem;
    align-items: center;
    gap: 8px;
    padding: 8px 8px 8px 6px;
    border: none;
    border-radius: 7px;
    background: none;
    color: var(--muted);
    font-family: var(--body);
    font-size: .87rem;
    line-height: 1.3;
    text-align: left;
    cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }

  .item:hover { background: var(--surface-2); color: var(--ink); }
  .item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .item[aria-current="true"] {
    background: var(--accent-soft);
    color: var(--ink);
    font-weight: 500;
  }

  .item .num {
    font-family: var(--mono);
    font-size: .78rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--border-strong);
  }

  .item[aria-current="true"] .num { color: var(--accent); }

  .item .marca {
    width: .5rem;
    height: .5rem;
    border-radius: 99px;
    justify-self: center;
    background: transparent;
    border: 1.5px solid var(--border-strong);
  }

  .item[data-feito="true"] .marca { background: var(--ok); border-color: var(--ok); }

  /* ---- card ---- */

  .ficha {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .topo {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    padding: 14px clamp(20px, 3.5vw, 36px);
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }

  .selo {
    font-family: var(--mono);
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .progresso {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: .72rem;
    letter-spacing: .06em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .trilho {
    width: 88px;
    height: 5px;
    border-radius: 99px;
    background: var(--border);
    overflow: hidden;
  }

  .barra {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 99px;
    transition: width .25s ease;
  }

  .cabeca {
    padding: clamp(22px, 3.5vw, 34px) clamp(20px, 3.5vw, 36px) clamp(20px, 3vw, 28px);
    border-bottom: 1px solid var(--border);
  }

  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(1.5rem, 3.6vw, 2.05rem);
    line-height: 1.15;
    letter-spacing: -.022em;
    text-wrap: balance;
  }

  .etiqueta {
    display: inline-block;
    margin-top: 12px;
    padding: 3px 10px;
    border: 1px solid var(--border-strong);
    border-radius: 99px;
    font-family: var(--mono);
    font-size: .7rem;
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .situacao {
    display: block;
    margin: 22px 0 0;
    padding-left: 18px;
    border-left: 3px solid var(--accent);
  }

  .situacao dt {
    font-family: var(--mono);
    font-size: .7rem;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .situacao dd {
    margin: 0;
    font-size: 1.02rem;
    line-height: 1.5;
    max-width: 60ch;
  }

  section {
    padding: clamp(22px, 3.5vw, 32px) clamp(20px, 3.5vw, 36px);
  }

  section + section { border-top: 1px solid var(--border); }

  .titulo-secao {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 0 0 20px;
    font-family: var(--mono);
    font-size: .76rem;
    font-weight: 600;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .titulo-secao::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  code {
    font-family: var(--mono);
    font-size: .86em;
    background: var(--code-bg);
    padding: 1px 6px;
    border-radius: 4px;
    overflow-wrap: anywhere;
  }

  /* ---- steps ---- */

  ol.passos {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    counter-reset: passo;
  }

  ol.passos li { counter-increment: passo; }

  .passo {
    display: grid;
    grid-template-columns: 2.1rem 1fr 1.35rem;
    align-items: start;
    gap: 0 14px;
    padding: 11px 12px 11px 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .12s ease;
  }

  .passo:hover { background: var(--surface-2); }

  .passo::before {
    content: counter(passo, decimal-leading-zero);
    font-family: var(--mono);
    font-size: .95rem;
    font-weight: 600;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    padding-top: 1px;
  }

  .passo .texto { max-width: 62ch; min-width: 0; }

  .passo input {
    appearance: none;
    width: 1.15rem;
    height: 1.15rem;
    margin: 2px 0 0;
    border: 1.5px solid var(--border-strong);
    border-radius: 5px;
    background: var(--surface);
    cursor: pointer;
    display: grid;
    place-content: center;
    transition: background .12s ease, border-color .12s ease;
  }

  .passo input::after {
    content: "";
    width: .62rem;
    height: .34rem;
    border-left: 2px solid var(--surface);
    border-bottom: 2px solid var(--surface);
    transform: rotate(-45deg) translate(1px, -1px);
    opacity: 0;
    transition: opacity .12s ease;
  }

  .passo input:checked { background: var(--accent); border-color: var(--accent); }
  .passo input:checked::after { opacity: 1; }
  .passo input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .passo:has(input:checked) .texto {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: var(--border-strong);
  }

  .passo:has(input:checked)::before { color: var(--muted); }

  /* ---- expected results ---- */

  .resultados {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .resultados li {
    display: grid;
    grid-template-columns: 1.35rem 1fr;
    gap: 12px;
    align-items: start;
    padding: 12px 14px;
    background: var(--ok-soft);
    border: 1px solid color-mix(in srgb, var(--ok) 22%, transparent);
    border-radius: 8px;
    max-width: 66ch;
  }

  .resultados li span { min-width: 0; }

  .resultados li svg {
    width: 1.15rem;
    height: 1.15rem;
    margin-top: 2px;
    color: var(--ok);
    flex: none;
  }

  strong { font-weight: 600; }
  em { font-style: italic; color: var(--muted); }

  /* ---- footer ---- */

  .rodape {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px clamp(20px, 3.5vw, 36px) clamp(20px, 3vw, 26px);
  }

  .passar {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 14px;
    font-family: var(--body);
    font-size: .87rem;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    transition: border-color .12s ease, background .12s ease;
  }

  .passar:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border-strong); }
  .passar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .passar:disabled { opacity: .35; cursor: default; }

  .limpar {
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: none;
    padding: 6px;
    cursor: pointer;
    transition: color .12s ease;
  }

  .limpar:hover { color: var(--ink); }
  .limpar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .indice { position: static; }
    .indice nav { max-height: 14rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  .impressao { display: none; }

  @media print {
    body { background: #fff; }
    .layout { display: none; }
    .impressao { display: block; }
    .impressao .ficha { box-shadow: none; border: none; break-after: page; }
    .impressao .passo { cursor: default; }
    .passo, .resultados li { break-inside: avoid; }
  }
</style>

<div class="layout">
  <aside class="indice">
    <header>
      <h2>{{Project}} v{{version}} · {{Test guide}}</h2>
      <p id="resumo"></p>
    </header>
    <nav id="nav"></nav>
  </aside>

  <article class="ficha">
    <div class="topo">
      <span class="selo" id="selo"></span>
      <div class="progresso">
        <span id="contagem"></span>
        <div class="trilho"><div class="barra" id="barra"></div></div>
      </div>
    </div>

    <header class="cabeca">
      <h1 id="titulo"></h1>
      <span class="etiqueta" id="etiqueta"></span>
      <dl class="situacao">
        <dt id="l-situacao"></dt>
        <dd id="situacao"></dd>
      </dl>
    </header>

    <section>
      <h2 class="titulo-secao" id="l-passos"></h2>
      <ol class="passos" id="passos"></ol>
    </section>

    <section>
      <h2 class="titulo-secao" id="l-esperado"></h2>
      <ul class="resultados" id="esperado"></ul>
    </section>

    <div class="rodape">
      <button class="passar" id="anterior" type="button"></button>
      <button class="limpar" id="limpar" type="button"></button>
      <button class="passar" id="proximo" type="button"></button>
    </div>
  </article>
</div>

<div class="impressao" id="impressao"></div>

<script>
// GUIDE: everything the skill fills. Text may hold <code>, <strong> and <em>.
const GUIDE = {
  key: "{{project-key}}-test-guide-v{{version}}{{-beta.n}}",  // localStorage key: a new beta starts clean
  labels: {
    of: "of", done: "done", scenario: "Scenario", situation: "The situation",
    steps: "What to do", expected: "What should happen",
    previous: "\u2190 Previous", next: "Next \u2192", clear: "Clear ticks", scenarios: "Scenarios"
  },
  scenarios: [
    {
      title: "{{A real job, in the client's words}}",
      tag: "{{Where in the app}}",
      situation: "{{A real situation, with names from the guide's cast.}}",
      steps: ["{{One step the tester does}}"],
      expected: ["{{What they should see}}"]
    }
  ]
};

(function () {
  var CHAVE = GUIDE.key;
  var L = GUIDE.labels;
  var atual = 0;
  var estado = ler();

  var nav = document.getElementById("nav");
  var selo = document.getElementById("selo");
  var titulo = document.getElementById("titulo");
  var etiqueta = document.getElementById("etiqueta");
  var situacao = document.getElementById("situacao");
  var passos = document.getElementById("passos");
  var esperado = document.getElementById("esperado");
  var barra = document.getElementById("barra");
  var contagem = document.getElementById("contagem");
  var resumo = document.getElementById("resumo");
  var anterior = document.getElementById("anterior");
  var proximo = document.getElementById("proximo");

  function ler() {
    var vazio = GUIDE.scenarios.map(function (c) { return c.steps.map(function () { return false; }); });
    try {
      var bruto = localStorage.getItem(CHAVE);
      if (!bruto) return vazio;
      var salvo = JSON.parse(bruto);
      return vazio.map(function (linha, i) {
        return linha.map(function (_, j) { return salvo[i] && salvo[i][j] === true; });
      });
    } catch (e) {
      return vazio;
    }
  }

  function gravar() {
    try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) { /* site data blocked */ }
  }

  function completo(i) {
    return estado[i].every(function (v) { return v; });
  }

  function dois(n) { return n < 10 ? "0" + n : String(n); }

  function montarIndice() {
    GUIDE.scenarios.forEach(function (c, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "item";
      b.innerHTML = '<span class="num">' + dois(i + 1) + '</span><span>' + c.title + '</span><span class="marca"></span>';
      b.addEventListener("click", function () { ir(i); });
      nav.appendChild(b);
    });
  }

  function pintarIndice() {
    var botoes = nav.querySelectorAll(".item");
    var feitos = 0;
    GUIDE.scenarios.forEach(function (_, i) {
      var pronto = completo(i);
      if (pronto) feitos++;
      botoes[i].setAttribute("data-feito", String(pronto));
      botoes[i].setAttribute("aria-current", String(i === atual));
    });
    resumo.textContent = feitos + " " + L.of + " " + GUIDE.scenarios.length + " " + L.done;
  }

  function pintarProgresso() {
    var marcados = estado[atual].filter(Boolean).length;
    var total = estado[atual].length;
    barra.style.width = (marcados / total * 100) + "%";
    contagem.textContent = marcados + " " + L.of + " " + total;
  }

  function ir(i) {
    atual = Math.max(0, Math.min(GUIDE.scenarios.length - 1, i));
    var c = GUIDE.scenarios[atual];

    selo.textContent = L.scenario + " " + dois(atual + 1);
    titulo.textContent = c.title;
    etiqueta.textContent = c.tag;
    situacao.innerHTML = c.situation;

    passos.innerHTML = "";
    c.steps.forEach(function (texto, j) {
      var li = document.createElement("li");
      var label = document.createElement("label");
      label.className = "passo";
      label.innerHTML = '<span class="texto">' + texto + '</span>';
      var caixa = document.createElement("input");
      caixa.type = "checkbox";
      caixa.checked = estado[atual][j];
      caixa.addEventListener("change", function () {
        estado[atual][j] = caixa.checked;
        gravar();
        pintarProgresso();
        pintarIndice();
      });
      label.appendChild(caixa);
      li.appendChild(label);
      passos.appendChild(li);
    });

    esperado.innerHTML = "";
    c.expected.forEach(function (texto) {
      var li = document.createElement("li");
      li.innerHTML =
        '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg><span>' +
        texto + "</span>";
      esperado.appendChild(li);
    });

    anterior.disabled = atual === 0;
    proximo.disabled = atual === GUIDE.scenarios.length - 1;

    if (location.hash !== "#s" + dois(atual + 1)) {
      history.replaceState(null, "", "#s" + dois(atual + 1));
    }

    pintarProgresso();
    pintarIndice();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  anterior.addEventListener("click", function () { ir(atual - 1); });
  proximo.addEventListener("click", function () { ir(atual + 1); });

  document.getElementById("limpar").addEventListener("click", function () {
    estado[atual] = estado[atual].map(function () { return false; });
    gravar();
    ir(atual);
  });

  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowRight") ir(atual + 1);
    if (e.key === "ArrowLeft") ir(atual - 1);
  });

  document.getElementById("l-situacao").textContent = L.situation;
  document.getElementById("l-passos").textContent = L.steps;
  document.getElementById("l-esperado").textContent = L.expected;
  anterior.textContent = L.previous;
  proximo.textContent = L.next;
  document.getElementById("limpar").textContent = L.clear;
  nav.setAttribute("aria-label", L.scenarios);

  // Print: every scenario, one per page, with empty boxes to tick by hand.
  var impressao = document.getElementById("impressao");
  var visto = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg>';
  GUIDE.scenarios.forEach(function (c, i) {
    var f = document.createElement("article");
    f.className = "ficha";
    f.innerHTML =
      '<header class="cabeca"><span class="selo">' + L.scenario + " " + dois(i + 1) + '</span><h1>' + c.title + '</h1>' +
      '<span class="etiqueta">' + c.tag + '</span><dl class="situacao"><dt>' + L.situation + '</dt><dd>' + c.situation + '</dd></dl></header>' +
      '<section><h2 class="titulo-secao">' + L.steps + '</h2><ol class="passos">' +
      c.steps.map(function (t) { return '<li><label class="passo"><span class="texto">' + t + '</span><input type="checkbox" disabled></label></li>'; }).join("") +
      '</ol></section><section><h2 class="titulo-secao">' + L.expected + '</h2><ul class="resultados">' +
      c.expected.map(function (t) { return '<li>' + visto + '<span>' + t + '</span></li>'; }).join("") +
      '</ul></section>';
    impressao.appendChild(f);
  });

  montarIndice();

  var doHash = parseInt((location.hash || "").replace("#s", ""), 10);
  ir(isNaN(doHash) ? 0 : doHash - 1);
})();
</script>
